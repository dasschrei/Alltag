name: Alltag
options:
  bundleIdPrefix: at.dasschrei
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Alltag:
    type: application
    platform: iOS
    sources:
      - path: Alltag
    info:
      path: Alltag/Info.plist
      properties:
        NSAlarmKitUsageDescription: "Alltag stellt deinen Wecker passend zur Losgeh-Zeit."
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.dasschrei.alltag
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alltag
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Alltag zeigt deine Termine im eigenen Kalender und trägt neue Termine ein."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Alltag hört zu, wenn du die Aktionstaste drückst und etwas diktierst."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Alltag wandelt dein Diktat in Text um."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Alltag berechnet Fahrzeiten zu deinen Terminen."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Alltag startet den Abend-Check, wenn du nach Hause kommst."
        INFOPLIST_KEY_NSContactsUsageDescription: "Alltag liest Geburtstage aus deinen Kontakten."
