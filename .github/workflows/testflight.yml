name: TestFlight

# Baut, signiert und lädt die App zu TestFlight hoch.
# Braucht die Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API, Rolle Admin).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-Rechner
        default: macos-15
  push:
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Secrets fehlen noch, TestFlight wird übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Xcode und Werkzeuge
        if: steps.check.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          brew install xcodegen

      - name: Schlüssel ablegen
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          # Schlüssel säubern: egal ob mit/ohne Zeilenumbrüche oder BEGIN/END-Zeilen eingefügt.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "Schlüssellänge (Zeichen): ${#BODY}"
          openssl pkey -in ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 -noout && echo "Schlüssel gültig" || echo "Schlüssel ungültig"
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n'); IID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \r\n')
          echo "Key-ID-Länge: ${#KID}, Issuer-ID-Länge: ${#IID}"
          if [ "$KID" != "$ASC_KEY_ID" ]; then mv ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/private_keys/AuthKey_${KID}.p8; fi
          echo "KID=$KID" >> "$GITHUB_ENV"
          echo "IID=$IID" >> "$GITHUB_ENV"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${KID}.p8" >> "$GITHUB_ENV"

      - name: Zugang zu App Store Connect prüfen
        if: steps.check.outputs.ready == 'true'
        run: |
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s); EXP=$((NOW + 600))
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KID" | b64)
          PAYLOAD=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$IID" "$NOW" "$EXP" | b64)
          DER=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign "$KEY_PATH" | xxd -p | tr -d '\n')
          # DER-Signatur in rohes r||s (je 32 Byte) umwandeln
          python3 - "$DER" > sig.txt <<'PY'
          import sys, base64
          d = bytes.fromhex(sys.argv[1]); i = 2
          def read():
              global i
              assert d[i] == 2; l = d[i+1]; v = d[i+2:i+2+l]; i += 2 + l
              return v.lstrip(b"\0").rjust(32, b"\0")
          sig = read() + read()
          print(base64.urlsafe_b64encode(sig).decode().rstrip("="))
          PY
          TOKEN="$HEADER.$PAYLOAD.$(cat sig.txt)"
          CODE=$(curl -s -o resp.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.appstoreconnect.apple.com/v1/apps?limit=5)
          echo "App Store Connect antwortet: HTTP $CODE"
          python3 -c "import json;d=json.load(open('resp.json'));[print('Fehler:',e.get('status'),e.get('code'),e.get('title'),e.get('detail')) for e in d.get('errors',[])];[print('App:',a['attributes']['bundleId']) for a in d.get('data',[])]"
          # Alte Entwicklungs-Zertifikate früherer CI-Läufe entfernen (von Jakob am 2026-11-18 erlaubt; kein eigener Mac).
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/certificates?limit=50" -o certs.json
          for CID in $(python3 -c "import json;d=json.load(open('certs.json'));print(' '.join(c['id'] for c in d.get('data',[]) if c['attributes']['certificateType'] in ('DEVELOPMENT','IOS_DEVELOPMENT')))"); do
            C=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/certificates/$CID")
            echo "Altes Entwicklungs-Zertifikat entfernt: HTTP $C"
          done
          CODE=$(curl -s -o resp2.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=20")
          echo "Bundle-IDs: HTTP $CODE"
          python3 -c "import json;d=json.load(open('resp2.json'));[print('Fehler:',e.get('title'),e.get('detail')) for e in d.get('errors',[])];[print('Bundle:',a['attributes']['identifier']) for a in d.get('data',[])]"

      - name: Archivieren (signiert)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Alltag.xcodeproj -scheme Alltag \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/Alltag.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$IID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tee archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Zu TestFlight hochladen
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>675RG8G4AR</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Alltag.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$IID"
